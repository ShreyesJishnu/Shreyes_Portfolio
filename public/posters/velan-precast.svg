<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="Precast manufacturer site, drawing-sheet layout">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#e2dbcc" stroke-width="1"/>
    </pattern>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#5c5c58" stroke-width="1.5"/>
    </pattern>
  </defs>

  <rect width="1280" height="720" fill="#f5f1ea"/>
  <rect width="1280" height="720" fill="url(#grid)" opacity="0.55"/>

  <!-- header rule -->
  <line x1="0" y1="96" x2="1280" y2="96" stroke="#cfc7b6" stroke-width="2"/>

  <!-- wordmark -->
  <rect x="52" y="30" width="44" height="44" fill="none" stroke="#7a1f1f" stroke-width="3"/>
  <path d="M62 66 L74 42 L86 66 Z" fill="none" stroke="#7a1f1f" stroke-width="3"/>
  <text x="112" y="52" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#1d1d1b" letter-spacing="0.5">NORTHGATE</text>
  <text x="112" y="72" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="13" letter-spacing="4" fill="#8a8375">PRECAST</text>

  <text x="330" y="52" font-family="ui-monospace, Menlo, monospace" font-size="14" letter-spacing="2" fill="#c4661d">A-01</text>
  <text x="404" y="52" font-family="ui-monospace, Menlo, monospace" font-size="14" letter-spacing="2" fill="#8a8375">A-02</text>
  <line x1="330" y1="62" x2="372" y2="62" stroke="#c4661d" stroke-width="2"/>

  <rect x="1064" y="26" width="164" height="52" fill="#7a1f1f"/>
  <text x="1146" y="58" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="14" letter-spacing="2" fill="#f5f1ea">WHATSAPP</text>

  <!-- left column -->
  <text x="52" y="164" font-family="ui-monospace, Menlo, monospace" font-size="13" letter-spacing="3" fill="#8a8375">SHEET A-01 · DEMO BUILD</text>

  <g font-family="Archivo, Helvetica, Arial, sans-serif" font-size="52" font-weight="600" fill="#7a1f1f" letter-spacing="-0.5">
    <text x="52" y="232">CAST IN</text>
    <text x="52" y="288">ONE MOULD.</text>
    <text x="52" y="344">DELIVERED</text>
    <text x="52" y="400">FINISHED.</text>
  </g>

  <g font-family="Archivo, Helvetica, Arial, sans-serif" font-size="17" fill="#4a4a45">
    <text x="52" y="444">Precast sumps, septic tanks, STP/ETP units, cabin</text>
    <text x="52" y="470">rooms and shelters, poured as a single piece.</text>
  </g>

  <line x1="52" y1="506" x2="470" y2="506" stroke="#cfc7b6" stroke-width="1.5"/>
  <g font-family="ui-monospace, Menlo, monospace" fill="#1d1d1b">
    <text x="52" y="552" font-size="30" font-weight="600">15+</text>
    <text x="52" y="576" font-size="11" letter-spacing="2" fill="#8a8375">YEARS OF</text>
    <text x="52" y="592" font-size="11" letter-spacing="2" fill="#8a8375">EXPERIENCE</text>

    <text x="204" y="552" font-size="30" font-weight="600">10,000+</text>
    <text x="204" y="576" font-size="11" letter-spacing="2" fill="#8a8375">UNITS</text>
    <text x="204" y="592" font-size="11" letter-spacing="2" fill="#8a8375">DELIVERED</text>

    <text x="384" y="552" font-size="30" font-weight="600">100+</text>
    <text x="384" y="576" font-size="11" letter-spacing="2" fill="#8a8375">TREATMENT</text>
    <text x="384" y="592" font-size="11" letter-spacing="2" fill="#8a8375">PROJECTS</text>
  </g>

  <!-- right: the drawing plate -->
  <text x="556" y="166" font-family="ui-monospace, Menlo, monospace" font-size="14" letter-spacing="2" fill="#4a4a45">CABIN ROOM — SECTION</text>
  <rect x="916" y="148" width="84" height="26" fill="#7a1f1f"/>
  <text x="958" y="166" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12" letter-spacing="1" fill="#f5f1ea">SECTION</text>
  <rect x="1006" y="148" width="62" height="26" fill="none" stroke="#cfc7b6" stroke-width="1.5"/>
  <text x="1037" y="166" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12" letter-spacing="1" fill="#8a8375">PLAN</text>
  <text x="1228" y="166" text-anchor="end" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#8a8375">DRG. A-02/05-S</text>

  <rect x="556" y="192" width="672" height="380" fill="#2b2b29"/>

  <!-- the unit, drawn in section -->
  <rect x="716" y="268" width="352" height="196" fill="none" stroke="#b9b4a6" stroke-width="7"/>
  <rect x="752" y="304" width="280" height="124" fill="none" stroke="#6f6b61" stroke-width="2"/>
  <rect x="778" y="330" width="86" height="98" fill="none" stroke="#6f6b61" stroke-width="2"/>
  <rect x="908" y="336" width="96" height="62" fill="none" stroke="#6f6b61" stroke-width="2"/>
  <rect x="700" y="252" width="384" height="18" fill="#3f3f3c" stroke="#b9b4a6" stroke-width="2"/>

  <!-- ground line + hatch -->
  <line x1="600" y1="500" x2="1184" y2="500" stroke="#e8e4da" stroke-width="2.5"/>
  <rect x="600" y="500" width="584" height="12" fill="url(#hatch)" opacity="0.7"/>

  <!-- callout balloons -->
  <g font-family="ui-monospace, Menlo, monospace" font-size="14" font-weight="600">
    <line x1="672" y1="288" x2="716" y2="300" stroke="#c4661d" stroke-width="1.5"/>
    <circle cx="662" cy="285" r="15" fill="#c4661d"/>
    <text x="662" y="290" text-anchor="middle" fill="#1d1d1b">1</text>

    <line x1="1068" y1="300" x2="1116" y2="288" stroke="#c4661d" stroke-width="1.5"/>
    <circle cx="1126" cy="285" r="15" fill="#c4661d"/>
    <text x="1126" y="290" text-anchor="middle" fill="#1d1d1b">4</text>

    <line x1="1068" y1="400" x2="1116" y2="412" stroke="#c4661d" stroke-width="1.5"/>
    <circle cx="1126" cy="415" r="15" fill="#c4661d"/>
    <text x="1126" y="420" text-anchor="middle" fill="#1d1d1b">2</text>

    <line x1="672" y1="470" x2="716" y2="458" stroke="#c4661d" stroke-width="1.5"/>
    <circle cx="662" cy="473" r="15" fill="#c4661d"/>
    <text x="662" y="478" text-anchor="middle" fill="#1d1d1b">3</text>
  </g>

  <text x="556" y="606" font-family="ui-monospace, Menlo, monospace" font-size="13" letter-spacing="2" fill="#4a4a45">THE RANGE — 5 OF 6: CABIN ROOM</text>
  <line x1="556" y1="640" x2="1228" y2="640" stroke="#cfc7b6" stroke-width="1.5"/>
  <line x1="1010" y1="626" x2="1010" y2="654" stroke="#c4661d" stroke-width="2.5"/>
  <g font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#8a8375">
    <text x="574" y="672">01</text><text x="686" y="672">02</text><text x="798" y="672">03</text>
    <text x="910" y="672">04</text><text x="1000" y="672" fill="#c4661d">05</text><text x="1134" y="672">06</text>
  </g>
</svg>
